<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <linearGradient id="bubbleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="4" />

  <!-- Chat Bubble with Glow -->
  <path d="M120 150 C120 110, 150 90, 200 90 L312 90 C362 90, 392 110, 392 150 L392 270 C392 310, 362 330, 312 330 L220 330 L150 390 L165 330 L200 330 C150 330, 120 310, 120 270 Z" 
        fill="url(#bubbleGrad)" 
        filter="url(#glow)" 
        opacity="0.95" />

  <!-- AI Sparkle 1 (Large) -->
  <path d="M256 160 Q256 210 216 210 Q256 210 256 260 Q256 210 296 210 Q256 210 256 160 Z" 
        fill="url(#sparkleGrad)" />

  <!-- AI Sparkle 2 (Small) -->
  <path d="M320 140 Q320 165 300 165 Q320 165 320 190 Q320 165 340 165 Q320 165 320 140 Z" 
        fill="#ffffff" 
        opacity="0.9" />

  <!-- E2EE Shield Accent -->
  <path d="M256 380 C290 380, 310 405, 310 425 C310 455, 256 480, 256 480 C256 480, 202 455, 202 425 C202 405, 222 380, 256 380 Z" 
        fill="#10b981" 
        opacity="0.85" />
  <path d="M256 405 L256 462 C275 448, 292 432, 292 425 C292 415, 280 405, 256 405 Z" 
        fill="#34d399" />
</svg>
